<style>
  :root{
    --bg:#ffffff;
    --canvas:#f4f5f7;
    --soft:#eef0f3;
    --ink:#15161a;
    --muted:#65686d;
    --hair:#dadce0;
    --accent:#169cdf;
    --card:#ffffff;
  }
  html[data-theme="dark"]{
    --bg:#1e1e1e;
    --canvas:#262626;
    --soft:#333333;
    --ink:#f3f4f6;
    --muted:#a8acb1;
    --hair:#3f3f3f;
    --accent:#3ab4e8;
    --card:#2a2a2a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background 280ms ease, color 280ms ease}
  a{color:inherit;text-decoration:none}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .meta{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .lead{font-size:19px;line-height:1.55;color:var(--muted);font-weight:400}
  .body{font-size:16px;line-height:1.6;color:var(--muted);font-weight:400}
  ::selection{background:var(--accent);color:#fff}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script>
  // Apply theme before paint to avoid flash
  (function(){
    try {
      var t = localStorage.getItem('fp-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
</script>
